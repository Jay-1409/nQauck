<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pongpin · System setup</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17211d;
      background: #f4f6f3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    aside { padding: 30px 20px; background: #172d26; color: #f4f8f5; }
    .brand { display: flex; align-items: center; gap: 11px; margin: 0 0 60px 8px; font-size: 20px; font-weight: 700; letter-spacing: -.04em; }
    .brand-mark { display: grid; width: 32px; height: 32px; place-items: center; border-radius: 10px; background: #a9e2bd; color: #172d26; font-size: 17px; }
    .nav-label { margin: 0 0 12px 10px; color: #91a99d; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .nav-item { padding: 11px 12px; border-radius: 9px; color: #e1ebe5; font-size: 13px; }
    .nav-item.active { background: #29463b; color: #c0f0cd; }
    main { width: min(100%, 960px); padding: 58px 64px; }
    .eyebrow { margin: 0 0 10px; color: #56876b; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 38px); letter-spacing: -.045em; }
    .intro { margin: 12px 0 34px; color: #68766e; font-size: 14px; line-height: 1.6; }
    .card { max-width: 650px; padding: 28px; border: 1px solid #e3e9e4; border-radius: 14px; background: #fff; box-shadow: 0 8px 30px #20392d0a; }
    .card-heading { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 24px; }
    .icon { display: grid; flex: 0 0 40px; height: 40px; place-items: center; border-radius: 11px; background: #e9f5ec; color: #3c8055; font-size: 19px; }
    h2 { margin: 1px 0 5px; font-size: 16px; }
    .card-heading p { margin: 0; color: #77837b; font-size: 12px; line-height: 1.5; }
    label { display: block; margin-bottom: 8px; font-size: 12px; font-weight: 650; }
    select { width: 100%; padding: 12px 14px; border: 1px solid #dce4dd; border-radius: 8px; background: #fff; color: #17211d; font: inherit; font-size: 13px; outline: none; }
    select:focus { border-color: #62a879; box-shadow: 0 0 0 3px #62a87924; }
    .hint { margin: 9px 0 0; color: #89948d; font-size: 11px; }
    @media (max-width: 680px) {
      .shell { grid-template-columns: 1fr; }
      aside { padding: 16px 20px; }
      .brand { margin: 0; }
      .nav-label, .nav-item { display: none; }
      main { padding: 38px 20px; }
      .card { padding: 22px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><span class="brand-mark">P</span> pongpin</div>
      <p class="nav-label">Workspace</p>
      <div class="nav-item active">System setup</div>
    </aside>
    <main>
      <p class="eyebrow">Configuration</p>
      <h1>Set up your system</h1>
      <p class="intro">Choose the queue provider Pongpin should use to deliver messages.</p>
      <section class="card" aria-labelledby="queue-title">
        <div class="card-heading">
          <span class="icon" aria-hidden="true">⇄</span>
          <div>
            <h2 id="queue-title">Queue provider</h2>
            <p>Select the messaging system configured for your environment.</p>
          </div>
        </div>
        <label for="queue-provider">Provider</label>
        <select id="queue-provider" name="queue-provider">
          <option value="RMQ">RabbitMQ (RMQ)</option>
          <option value="SQS">Amazon SQS</option>
          <option value="KAFKA">Apache Kafka</option>
        </select>
      </section>
    </main>
  </div>
</body>
</html>
